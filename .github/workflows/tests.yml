name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: playwright install --with-deps chromium
      - run: pytest

  windows-setup:
    # Rejoue l'installation guidee du README sur un vrai Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/setup.py --yes --skip-preview
      # Une seconde execution ne doit pas buter sur des fichiers deja installes.
      - run: python scripts/setup.py --yes --skip-preview
